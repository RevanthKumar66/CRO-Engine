<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gymshark Official Store | Gym Clothes & Workout Wear</title>
  <meta name="description" content="Shop Gymshark activewear catalog. Free shipping over $75. Easy returns. Be a visionary.">
  <meta property="og:title" content="Gymshark Official Store">
  <meta property="og:description" content="Shop Gymshark activewear catalog.">
  <meta property="og:image" content="https://cdn.shopify.com/s/files/1/0139/gymshark-logo.jpg">
  <link rel="canonical" href="https://gymshark.com">
</head>
<body>
  <header>
    <div class="logo">Gymshark</div>
    <nav>
      <a href="/collections/mens">Men</a>
      <a href="/collections/womens">Women</a>
      <a href="/collections/accessories">Accessories</a>
      <a href="/cart">Cart</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>BE A VISIONARY</h1>
      <p>Explore the new lifting essentials lineup.</p>
      <a href="/collections/mens" class="btn">Shop Men</a>
      <a href="/collections/womens" class="btn">Shop Women</a>
    </section>

    <section class="products-grid">
      <div class="product-card">
        <img src="/assets/images/legacy-hoodie.jpg" alt="Gymshark Legacy Hoodie">
        <h3 class="product-item__title">Gymshark Legacy Hoodie</h3>
        <span class="price">$55.00</span>
        <button class="add-to-cart">Add to Cart</button>
      </div>
    </section>
  </main>

  <footer>
    <div class="payment-icon paypal">Paypal</div>
    <div class="payment-icon visa">Visa</div>
    <div class="shipping-info">Free standard shipping on orders over $75.</div>
    <div class="return-policy">Free returns on all orders within 30 days.</div>
    <div class="social-links">
      <a href="https://instagram.com/gymshark">Instagram</a>
      <a href="https://twitter.com/gymshark">Twitter</a>
    </div>
  </footer>
</body>
</html>
