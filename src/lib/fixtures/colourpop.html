<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ColourPop Cosmetics | Cruelty-Free Makeup & Beauty</title>
  <meta name="description" content="Cruelty-free makeup palettes, lipsticks, and beauty collections. Low price, high quality.">
  <link rel="canonical" href="https://colourpop.com">
</head>
<body>
  <header>
    <div class="logo">ColourPop</div>
    <nav>
      <a href="/collections/palettes">Palettes</a>
      <a href="/collections/lips">Lips</a>
      <a href="/collections/sale">Sale</a>
    </nav>
  </header>

  <main>
    <section class="collection-header">
      <h1>Eyeshadow Palettes</h1>
      <div class="sorting-controls">
        <select name="sort_by">
          <option value="best-selling">Best Selling</option>
          <option value="price-low-high">Price: Low to High</option>
        </select>
      </div>
      <div class="filter-sidebar">
        <label><input type="checkbox" name="filter.color" value="pink"> Pink</label>
        <label><input type="checkbox" name="filter.price" value="under-15"> Under $15</label>
      </div>
    </section>

    <div class="product-grid">
      <div class="product-item">
        <h3 class="product-item__title">Going Coconuts Palette</h3>
        <span class="price">$14.00</span>
      </div>
      <div class="product-item">
        <h3 class="product-item__title font-bold">Bare Necessities Mega Palette</h3>
        <span class="price">$34.00</span>
      </div>
    </div>
  </main>

  <footer>
    <div class="payment-icon shopify-pay">Shopify Pay</div>
    <div class="shipping-info">Free US shipping on orders over $30.</div>
    <div class="return-policy">Due to low price limits, all sales are final.</div>
  </footer>
</body>
</html>
